server:
  port: 8085

spring:
  application:
    name: evault-notifications

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/evault_notifications?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Rajat16@2}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# From address used in outgoing emails — set MAIL_* env vars in production
evault:
  mail:
    from: ${MAIL_FROM:noreply@evault.gov.in}

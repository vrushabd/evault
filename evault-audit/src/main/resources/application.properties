server.port=8084
spring.application.name=evault-audit

# MySQL - override via environment variables in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evault_audit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rajat16@2}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Blockchain service URL
evault.blockchain.url=${BLOCKCHAIN_URL:http://localhost:8083}

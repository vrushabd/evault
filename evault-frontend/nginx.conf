server {
    listen 80;
    server_name _;

    # Serve the React frontend
    root /usr/share/nginx/html;
    index index.html;

    # All API traffic is proxied to the gateway container internally
    location /api/ {
        proxy_pass http://evault-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /blockchain/ {
        proxy_pass http://evault-gateway:8080/blockchain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /audit/ {
        proxy_pass http://evault-integration:8086/audit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ecourts/ {
        proxy_pass http://evault-gateway:8080/ecourts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /classify/ {
        proxy_pass http://evault-gateway:8080/classify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /aadhaar/ {
        proxy_pass http://evault-gateway:8080/aadhaar/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA fallback - all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

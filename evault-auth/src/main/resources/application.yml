server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: evault-auth
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/evault_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Rajat16@2}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:changeme-use-a-long-random-secret-in-production-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:3600000}  # 1 hour in milliseconds

app:
  internal-api-key: ${INTERNAL_API_KEY:changeme-internal-key}
  nonce:
    ttl-minutes: ${NONCE_TTL_MINUTES:5}

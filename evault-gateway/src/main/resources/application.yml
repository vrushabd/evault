server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: evault-gateway
  cloud:
    gateway:
      default-filters:
        # Downstream services also set CORS; keep gateway's headers only
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${CORS_ORIGIN_1:http://localhost:3000}"
              - "${CORS_ORIGIN_2:http://127.0.0.1:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - AddRequestHeader=X-Internal-Api-Key, ${INTERNAL_API_KEY:changeme-internal-key}
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/documents/**
        - id: blockchain-service
          uri: ${BLOCKCHAIN_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/blockchain/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/audit/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**
        - id: integration-ecourts
          uri: ${INTEGRATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/ecourts/**
        - id: integration-classify
          uri: ${INTEGRATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/classify/**
        - id: integration-aadhaar
          uri: ${INTEGRATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/aadhaar/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN

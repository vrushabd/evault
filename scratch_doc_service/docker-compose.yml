version: '3.8'

services:
  document-service:
    build: .
    container_name: evault-documents-api
    ports:
      - "8082:8082"
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: evault-documents-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: evault_documents
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
